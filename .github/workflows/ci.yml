name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # STATUS.md is state, not history — this keeps it from growing back into a
      # changelog, which is what makes `git log -p STATUS.md` usable as one.
      - name: check STATUS.md
        run: ./scripts/check-status.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: make test

  # Dependabot covers module and action versions, but nothing it tracks maps to
  # the `go` directive — so stdlib CVEs (fixed by a toolchain bump, not a
  # dependency bump) are invisible to it. This is the only check that sees them,
  # and the release build pins its toolchain from go.mod, so a miss here ships.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # systray and dialog are cgo — without the GTK/ayatana headers govulncheck
      # cannot load those packages and fails before it scans anything.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-windows:
    name: Build (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-windows

  # Exercise the CGO/Cocoa darwin build and the CGO+GTK linux build on every
  # push — these cannot be cross-compiled from the Windows build host, so a
  # build break (e.g. a systray API change) is otherwise invisible until a
  # release tag. Mirrors the matrix in release.yml.
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-mac build-mac-arm

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: make build-linux

      # Published so a Steam Deck can be set up from a branch build without
      # waiting for a release tag — docs/steam-deck.md installs this file.
      # Tagged builds get the same binary as a release asset via release.yml;
      # this is the untagged path, so it keeps CI's default retention.
      - uses: actions/upload-artifact@v7
        with:
          name: ludotrace-linux
          path: dist/ludotrace-linux
          if-no-files-found: error

  # The binary that actually runs on a Steam Deck. Built and uploaded separately
  # from build-linux because it is a different artifact, not a variant flag:
  # -tags headless drops systray and sqweek/dialog, which lets CGO_ENABLED=0
  # produce a static binary. SteamOS has no libayatana-appindicator3, so the
  # dynamically-linked build above cannot start there at all.
  build-linux-headless:
    name: Build (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # No apt install: the whole point is that this build needs no GTK.
      - run: make build-linux-headless

      # Guards the property the Steam Deck depends on. A stray cgo import would
      # otherwise reintroduce a dynamic link and only fail on the device.
      - name: Assert the binary is static
        run: |
          if ! file dist/ludotrace-linux-headless | grep -q "statically linked"; then
            echo "::error::headless build is not static — it will not run on SteamOS"
            file dist/ludotrace-linux-headless
            ldd dist/ludotrace-linux-headless || true
            exit 1
          fi
          echo "OK: statically linked, no shared library dependencies"

      - uses: actions/upload-artifact@v7
        with:
          name: ludotrace-linux-headless
          path: dist/ludotrace-linux-headless
          if-no-files-found: error
