name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # STATUS.md is state, not history — this keeps it from growing back into a
      # changelog, which is what makes `git log -p STATUS.md` usable as one.
      - name: check STATUS.md
        run: ./scripts/check-status.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: make test

  # Dependabot covers module and action versions, but nothing it tracks maps to
  # the `go` directive — so stdlib CVEs (fixed by a toolchain bump, not a
  # dependency bump) are invisible to it. This is the only check that sees them,
  # and the release build pins its toolchain from go.mod, so a miss here ships.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-windows:
    name: Build (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-windows

  # Exercise the CGO/Cocoa darwin build and the CGO+GTK linux build on every
  # push — these cannot be cross-compiled from the Windows build host, so a
  # build break (e.g. a systray API change) is otherwise invisible until a
  # release tag. Mirrors the matrix in release.yml.
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-mac build-mac-arm

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: make build-linux
