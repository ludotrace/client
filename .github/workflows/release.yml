name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # If one platform fails, stop — a partial release must never publish.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-windows
          - os: macos-latest
            name: macos
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # systray needs CGO + GTK to build the Linux binary.
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      # Windows is pure-Go (CGO off); Linux is CGO+GTK. Both build on ubuntu.
      - name: Build Windows + Linux
        if: matrix.os == 'ubuntu-latest'
        run: make build-windows build-linux

      # darwin/systray needs CGO + Cocoa — only available on a macOS runner.
      # Cannot be cross-compiled from ubuntu (Go disables CGO when cross-
      # compiling, and there is no macOS toolchain on the Linux runner).
      - name: Build macOS (x64 + arm64)
        if: matrix.os == 'macos-latest'
        run: make build-mac build-mac-arm

      # shasum is present on both ubuntu and macOS runners; sha256sum is not
      # on stock macOS. The publish job only reads field 1 (the hash).
      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            shasum -a 256 "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist/
          retention-days: 1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # No binary assets attached — binaries are served from ludotrace.com/downloads/

  publish-site:
    name: Publish to site repo
    needs: [build, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: Checkout site repo
        uses: actions/checkout@v7
        with:
          repository: ludotrace/ludotrace.github.io
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site

      - name: Copy binaries into site downloads/
        run: |
          mkdir -p site/downloads
          cp dist/ludotrace-mac-x64   site/downloads/ludotrace-mac-x64
          cp dist/ludotrace-mac-arm64 site/downloads/ludotrace-mac-arm64
          cp dist/ludotrace.exe       site/downloads/ludotrace.exe
          cp dist/ludotrace-linux     site/downloads/ludotrace-linux

      - name: Write version manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SHA_MAC_X64=$(awk '{print $1}' dist/ludotrace-mac-x64.sha256)
          SHA_MAC_ARM=$(awk '{print $1}' dist/ludotrace-mac-arm64.sha256)
          SHA_WIN=$(awk '{print $1}' dist/ludotrace.exe.sha256)
          SHA_LINUX=$(awk '{print $1}' dist/ludotrace-linux.sha256)

          mkdir -p site/client
          cat > site/client/version.json <<EOF
          {
            "version": "${VERSION#v}",
            "next_check_seconds": 86400,
            "platforms": {
              "darwin/amd64":  { "url": "https://ludotrace.com/downloads/ludotrace-mac-x64",   "sha256": "${SHA_MAC_X64}" },
              "darwin/arm64":  { "url": "https://ludotrace.com/downloads/ludotrace-mac-arm64",  "sha256": "${SHA_MAC_ARM}" },
              "windows/amd64": { "url": "https://ludotrace.com/downloads/ludotrace.exe",         "sha256": "${SHA_WIN}" },
              "linux/amd64":   { "url": "https://ludotrace.com/downloads/ludotrace-linux",       "sha256": "${SHA_LINUX}" }
            }
          }
          EOF

      - name: Stamp download version into site page
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i -E 's#(<p class="download-version">)[^<]*(</p>)#\1'"${VERSION}"'\2#' site/index.html

      - name: Commit and push site
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/ client/version.json index.html
          git commit -m "release: client ${{ github.ref_name }}"
          git push
