name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set version output
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build deps
        run: sudo apt-get install -y libgtk-3-dev libappindicator3-dev

      - name: Build all platforms
        run: make build-all

      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum ludotrace-mac-x64  > ludotrace-mac-x64.sha256
          sha256sum ludotrace-mac-arm64 > ludotrace-mac-arm64.sha256
          sha256sum ludotrace.exe       > ludotrace.exe.sha256
          sha256sum ludotrace-linux     > ludotrace-linux.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/
          retention-days: 1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          # No binary assets attached — binaries are served from ludotrace.com/downloads/

  publish-site:
    name: Publish to site repo
    needs: [build, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: ludotrace/ludotrace.github.io
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site

      - name: Copy binaries into site downloads/
        run: |
          mkdir -p site/downloads
          cp dist/ludotrace-mac-x64   site/downloads/ludotrace-mac-x64
          cp dist/ludotrace-mac-arm64 site/downloads/ludotrace-mac-arm64
          cp dist/ludotrace.exe       site/downloads/ludotrace.exe
          cp dist/ludotrace-linux     site/downloads/ludotrace-linux

      - name: Write version manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          SHA_MAC_X64=$(awk '{print $1}' dist/ludotrace-mac-x64.sha256)
          SHA_MAC_ARM=$(awk '{print $1}' dist/ludotrace-mac-arm64.sha256)
          SHA_WIN=$(awk '{print $1}' dist/ludotrace.exe.sha256)
          SHA_LINUX=$(awk '{print $1}' dist/ludotrace-linux.sha256)

          mkdir -p site/client
          cat > site/client/version.json <<EOF
          {
            "version": "${VERSION#v}",
            "next_check_seconds": 86400,
            "platforms": {
              "darwin/amd64":  { "url": "https://ludotrace.com/downloads/ludotrace-mac-x64",   "sha256": "${SHA_MAC_X64}" },
              "darwin/arm64":  { "url": "https://ludotrace.com/downloads/ludotrace-mac-arm64",  "sha256": "${SHA_MAC_ARM}" },
              "windows/amd64": { "url": "https://ludotrace.com/downloads/ludotrace.exe",         "sha256": "${SHA_WIN}" },
              "linux/amd64":   { "url": "https://ludotrace.com/downloads/ludotrace-linux",       "sha256": "${SHA_LINUX}" }
            }
          }
          EOF

      - name: Commit and push site
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/ client/version.json
          git commit -m "release: client ${{ needs.build.outputs.version }}"
          git push
