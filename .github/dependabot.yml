version: 2
updates:
  # Go module dependencies
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      # Roll routine minor/patch bumps into a single PR to cut review noise.
      go-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by ci.yml / release.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types:
          - minor
          - patch
